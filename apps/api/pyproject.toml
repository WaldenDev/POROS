[project]
name = "poros-api"
version = "0.1.0"
description = "Evidence-grounded GitHub exploration and project ideation backend."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.0",
  "langgraph>=1.2.8",
]

[dependency-groups]
dev = [
  "httpx2>=2.5.0",
  "ruff>=0.12.0",
]

[tool.uv]
package = false

