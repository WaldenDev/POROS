[project]
name = "poros-api"
version = "0.1.0"
description = "Evidence-grounded GitHub Explorer backend."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic>=2.11.0",
]

[dependency-groups]
dev = [
  "httpx2>=2.12.0,<3",
  "ruff>=0.12.0",
]

[tool.uv]
package = false
constraint-dependencies = [
  "anyio>=4.14.2,<5",
  "certifi>=2026.10.19",
]
