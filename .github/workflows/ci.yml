name: Explorer checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: '3.12'
      - run: npm install --global pnpm@11.9.0
      - run: uv sync --frozen
        working-directory: apps/api
      - run: uv run python -m unittest test_release_setup
        working-directory: apps/api
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm exec tsx --test tests/static-preview.test.ts
        working-directory: apps/web
      - run: pnpm build:explorer
        working-directory: apps/web
      - run: pnpm build:demo
        working-directory: apps/web
